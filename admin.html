<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIND Academy | Admin</title><style>
:root{color-scheme:light dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#0c1222;color:#edf2ff}main{max-width:1050px;margin:40px auto;padding:20px}h1{margin-bottom:8px}.muted{color:#a9b6d3}.panel{background:#151f35;border:1px solid #293858;border-radius:16px;padding:18px;margin:18px 0}input,button,select{font:inherit;border-radius:9px;padding:11px;border:1px solid #3a4b70}input{width:min(100%,520px);box-sizing:border-box;background:#0c1222;color:inherit}button{cursor:pointer;background:#5968ee;color:white;border:0;margin:5px 5px 5px 0}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:12px;border-bottom:1px solid #293858;vertical-align:top}th{color:#b9c6ff}td{overflow-wrap:anywhere}.table-wrap{overflow:auto}.status{background:#0c1222;color:inherit}.notice{min-height:24px;color:#a9c8ff}small{color:#a9b6d3}.hidden{display:none}
</style></head><body><main><h1>MIND Academy</h1><p class="muted">لوحة متابعة طلبات التسجيل</p><section class="panel"><label for="token">Admin token</label><br><input id="token" type="password" autocomplete="current-password" placeholder="الصق ADMIN_TOKEN هنا"><button id="load">عرض الطلبات</button><p class="muted">التوكن بيتحفظ في الصفحة الحالية فقط، ومش بيتبعت غير للـ API بتاع الموقع.</p><div id="notice" class="notice" role="status"></div></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>#</th><th>الاسم</th><th>التواصل</th><th>المجال</th><th>الرسالة</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody id="rows"><tr><td colspan="7">سجّل دخولك علشان تشوف الطلبات.</td></tr></tbody></table></div></section></main><script>
const token=document.querySelector('#token'), notice=document.querySelector('#notice'), rows=document.querySelector('#rows');
function cell(value){const td=document.createElement('td');td.textContent=value??'';return td}
async function load(){notice.textContent='جاري تحميل الطلبات...';try{const r=await fetch('/api/admin/registrations',{headers:{Authorization:'Bearer '+token.value}});const data=await r.json();if(!r.ok)throw new Error(data.error||'فشل تحميل البيانات');rows.replaceChildren();if(!data.registrations.length){rows.innerHTML='<tr><td colspan="7">مفيش طلبات تسجيل لحد دلوقتي.</td></tr>';}for(const item of data.registrations){const tr=document.createElement('tr');[item.id,item.name,item.contact,item.interest,item.message,new Date(item.created_at).toLocaleString()].forEach(v=>tr.appendChild(cell(v)));const td=document.createElement('td');const select=document.createElement('select');select.className='status';[['new','جديد'],['contacted','تم التواصل'],['closed','مغلق']].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;select.appendChild(o)});select.value=item.status;select.addEventListener('change',async()=>{const resp=await fetch('/api/admin/registrations/'+item.id,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token.value},body:JSON.stringify({status:select.value})});if(!resp.ok){notice.textContent='محصلش تحديث للحالة.';return}notice.textContent='تم تحديث الحالة.'});td.appendChild(select);tr.appendChild(td);rows.appendChild(tr)}notice.textContent='عدد الطلبات المعروضة: '+data.registrations.length}catch(e){notice.textContent=e.message}}
document.querySelector('#load').addEventListener('click',load);token.addEventListener('keydown',e=>{if(e.key==='Enter')load()});
</script></body></html>
